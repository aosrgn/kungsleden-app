name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/brainstorm-optimize-ITvoa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build metadata
        run: |
          SHA="${GITHUB_SHA::7}"
          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed -i "s|__COMMIT_SHA__|${SHA}|g" index.html
          sed -i "s|__BUILD_TIME__|${TS}|g" index.html

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
